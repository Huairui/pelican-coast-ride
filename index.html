<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1B1B3A" />
  <title>鹈鹕海岸骑行 · Pelican Coast Ride</title>
  <meta name="description" content="戴头盔墨镜、脖系红围巾的鹈鹕，在海岸公路上骑车抓鱼。布料围巾、昼夜循环、程序化音效与 14 成就。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- 开场标题 -->
    <div id="intro" class="overlay intro">
      <div class="intro-card">
        <div class="intro-badge">COASTAL ADVENTURE</div>
        <h1>鹈鹕海岸骑行</h1>
        <p class="intro-sub">戴头盔墨镜的红围巾鹈鹕 · 黄昏到星夜 · 骑车抓鱼</p>
        <button id="btn-start" class="btn-primary">开始骑行</button>
        <div class="intro-keys">
          <span><kbd>W</kbd><kbd>S</kbd> 加减速</span>
          <span><kbd>A</kbd><kbd>D</kbd> 变道抓鱼</span>
          <span><kbd>Space</kbd> 跳跃</span>
          <span><kbd>T</kbd> 展翅抬前轮</span>
          <span><kbd>C</kbd> 镜头</span>
        </div>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hud hidden">
      <div class="hud-tl">
        <div class="speed-block">
          <div class="speed-num" id="speed-val">0</div>
          <div class="speed-unit">km/h</div>
        </div>
        <div class="stat-row">
          <div class="chip"><span class="chip-label">踏频</span><span id="cadence-val">0</span></div>
          <div class="chip"><span class="chip-label">鱼获</span><span id="fish-val">0</span></div>
          <div class="chip"><span class="chip-label">里程</span><span id="dist-val">0.0</span><span class="chip-unit">km</span></div>
        </div>
      </div>

      <div class="hud-tr">
        <div class="cam-chip"><span class="dot"></span><span id="cam-name">追尾跟随</span></div>
        <div class="ach-progress">
          <div class="ach-label">成就 <span id="ach-count">0</span>/14</div>
          <div class="ach-bar"><div class="ach-fill" id="ach-fill"></div></div>
        </div>
        <div class="time-chip" id="time-label">黄昏</div>
      </div>

      <div class="hud-bl touch-only">
        <div class="touch-pad">
          <button class="tbtn" data-key="KeyA" aria-label="左变道">◀</button>
          <div class="touch-col">
            <button class="tbtn" data-key="KeyW" aria-label="加速">▲</button>
            <button class="tbtn" data-key="KeyS" aria-label="减速">▼</button>
          </div>
          <button class="tbtn" data-key="KeyD" aria-label="右变道">▶</button>
        </div>
      </div>

      <div class="hud-br">
        <button class="tbtn wide" data-key="Space" id="btn-jump">跳跃</button>
        <button class="tbtn wide" data-key="KeyT" id="btn-wing">展翅</button>
        <button class="tbtn wide" data-key="KeyC" id="btn-cam">镜头</button>
        <button class="tbtn wide ghost" id="btn-sound" aria-label="声音">♪</button>
      </div>

      <div id="toast-layer"></div>
      <div id="autopilot-badge" class="auto-badge hidden">AUTO 驾驶中</div>
    </div>

    <!-- 成就墙 -->
    <div id="ach-panel" class="overlay panel hidden">
      <div class="panel-card">
        <div class="panel-head">
          <h2>成就墙</h2>
          <button class="btn-ghost" id="btn-close-ach">关闭</button>
        </div>
        <div class="ach-grid" id="ach-grid"></div>
        <div class="panel-stats" id="panel-stats"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
